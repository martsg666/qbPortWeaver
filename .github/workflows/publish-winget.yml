name: Publish to winget

# Run manually after the GitHub Release for the tag exists (the MSI asset must be
# published). Uses wingetcreate to update the martsg666.qbPortWeaver manifests in
# microsoft/winget-pkgs and open the submission PR from the martsg666/winget-pkgs fork.
#
# Requires the WINGET_TOKEN secret: a classic PAT with the public_repo (or repo) scope AND the
# workflow scope, used by wingetcreate to push the manifest branch to the fork and open the PR.
# The workflow scope is not optional: syncing the fork pulls in upstream commits that touch
# winget-pkgs' own .github/workflows, and GitHub refuses that without it.
#
# The package must already exist in winget-pkgs (first submission was a manual PR);
# this workflow only submits version updates. wingetcreate downloads the MSI itself,
# so the new SHA256 and ProductCode are read from the installer automatically.
#
# wingetcreate rewrites the installer manifest but carries the locale manifest forward
# unchanged, so the description and tags would otherwise stay frozen at whatever the
# first submission said. The update is therefore written to disk first, the locale
# metadata is refreshed from the values below, and only then is it submitted. Keep
# those values in step with choco/qbPortWeaver.nuspec when the feature set changes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish - must include the v prefix (e.g. vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-winget:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # -----------------------------------------------------------------------
      # 1. Derive the semver version from the tag (strip leading 'v')
      # -----------------------------------------------------------------------
      - name: Resolve tag and version
        id: version
        shell: pwsh
        env:
          GH_INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GH_INPUT_TAG
          if (-not $tag.StartsWith('v')) {
            throw "Tag must start with 'v' (e.g. vX.Y.Z). Got: $tag"
          }
          $version = $tag.TrimStart('v')
          "TAG=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing version: $version  (tag: $tag)"

      # -----------------------------------------------------------------------
      # 2. Validate required secrets are present before attempting the submission
      # -----------------------------------------------------------------------
      - name: Validate required secrets
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINGET_TOKEN) {
            throw "WINGET_TOKEN secret is not configured. Add a classic PAT with the public_repo (or repo) scope AND the workflow scope in Settings → Secrets before running this workflow."
          }
          Write-Host "Required secrets validated."

      # -----------------------------------------------------------------------
      # 3. Verify the MSI asset exists on the release and the version is not
      #    already in winget-pkgs, so re-runs are safe.
      # -----------------------------------------------------------------------
      - name: Verify release asset and winget state
        id: verify
        shell: pwsh
        env:
          GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG:     ${{ steps.version.outputs.TAG }}
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag     = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $msi     = "qbPortWeaver_${version}_Setup.msi"

          $assets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($assets -notcontains $msi) {
            throw "Release $tag does not contain the expected MSI asset: $msi"
          }
          Write-Host "Release asset found: $msi"

          # Skip the submission if this version is already in winget-pkgs (e.g. workflow re-run).
          # 2xx -> already present, skip.
          # 404 -> not yet present, proceed.
          # anything else (5xx, network error) -> re-throw so the step fails loudly rather than
          #         silently assuming "not published" and risking a duplicate submission.
          $alreadyPublished = $false
          try {
            Invoke-WebRequest `
              -Uri "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/m/martsg666/qbPortWeaver/$version" `
              -Headers @{ 'User-Agent' = 'qbPortWeaver-CI'; 'Authorization' = "Bearer $env:GH_TOKEN" } `
              -Method Head | Out-Null
            $alreadyPublished = $true
          } catch {
            if ($_.Exception.Response?.StatusCode -ne [System.Net.HttpStatusCode]::NotFound) { throw }
          }
          if ($alreadyPublished) {
            Write-Host "martsg666.qbPortWeaver $version is already in winget-pkgs - skipping submission."
          }
          "ALREADY_PUBLISHED=$alreadyPublished" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "MSI_URL=https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$msi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # -----------------------------------------------------------------------
      # 4. Fast-forward the winget-pkgs fork to upstream. wingetcreate branches off the fork to
      #    raise its PR and tries to sync it first, but gives up on a large gap - and the gap is
      #    always large, because winget-pkgs takes thousands of commits between our releases
      #    (6,513 behind at the 2.6.4 publish, which failed with "The forked repository could not
      #    be synced with the upstream commits").
      #
      #    merge-upstream is a fast-forward only: it cannot discard fork-local commits, and this
      #    fork never has any - it exists solely as wingetcreate's PR source. A conflict response
      #    (409) therefore means someone committed to the fork directly, which is worth failing on
      #    rather than papering over.
      # -----------------------------------------------------------------------
      - name: Sync winget-pkgs fork with upstream
        if: steps.verify.outputs.ALREADY_PUBLISHED != 'True'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $fork = "$($env:GITHUB_REPOSITORY_OWNER)/winget-pkgs"
          try {
            $result = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$fork/merge-upstream" `
              -Method Post `
              -Headers @{ 'User-Agent' = 'qbPortWeaver-CI'; 'Authorization' = "Bearer $env:WINGET_TOKEN"; 'Accept' = 'application/vnd.github+json' } `
              -Body (@{ branch = 'master' } | ConvertTo-Json) `
              -ContentType 'application/json'
            Write-Host "Fork $fork synced: $($result.merge_type) - $($result.message)"
          } catch {
            $status = $_.Exception.Response?.StatusCode
            # 409 = the fork has diverged and cannot fast-forward; a human needs to look.
            # 403/422 may mean the token lacks the scope to merge upstream commits that touch
            # .github/workflows (the `gh repo sync` CLI hits exactly that with a public_repo-only
            # PAT). If that is the cause, either add the workflow scope to WINGET_TOKEN or press
            # "Sync fork" on https://github.com/$fork by hand and re-run.
            throw "Could not sync $fork with upstream (HTTP $status): $($_.Exception.Message)"
          }

      # -----------------------------------------------------------------------
      # 5. Update the manifests with wingetcreate, writing them to disk instead of
      #    submitting straight away, so the locale metadata can be refreshed first.
      # -----------------------------------------------------------------------
      - name: Update manifests
        if: steps.verify.outputs.ALREADY_PUBLISHED != 'True'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
          MSI_URL:         ${{ steps.verify.outputs.MSI_URL }}
          WINGET_TOKEN:    ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://aka.ms/wingetcreate/latest' -OutFile wingetcreate.exe
          .\wingetcreate.exe update martsg666.qbPortWeaver `
            --version $env:RELEASE_VERSION `
            --urls $env:MSI_URL `
            --out .\winget-out `
            --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # -----------------------------------------------------------------------
      # 6. Refresh the locale manifest. wingetcreate copies these fields forward
      #    verbatim from the previous version, so without this they never track
      #    the app's actual feature set.
      # -----------------------------------------------------------------------
      - name: Refresh locale metadata
        if: steps.verify.outputs.ALREADY_PUBLISHED != 'True'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Plain single-line scalar, matching the field's existing style in the manifest.
          $shortDescription =
            'Syncs the listening port of qBittorrent, Transmission, Deluge, or Nicotine+ with the ' +
            'VPN-assigned port, and imports media files into Plex-compatible library folders'

          # One entry per paragraph. Emitted under a '|-' literal block, matching the
          # field's existing style, so each stays a separate paragraph.
          $description = @(
            'qbPortWeaver is a Windows system tray application that keeps the listening port of qBittorrent, Transmission, Deluge, or Nicotine+ synchronized with the port assigned by ProtonVPN, PIA, or any NAT-PMP capable VPN gateway or router.'
            'It monitors the VPN''s forwarded port on a configurable interval, updates the client automatically when the port changes, verifies the port is reachable, and can recover the VPN connection automatically when port detection fails. Nicotine+ is driven through a small bridge plugin that qbPortWeaver installs, so its port changes while the client keeps running. A Status panel shows the live sync chain, recent port changes, and session statistics, and a built-in Media Manager can import media files into Plex-compatible library folders.'
          )

          # winget allows at most 16 tags; this list is exactly 16.
          $tags = @(
            'qbittorrent', 'transmission', 'deluge', 'nicotine-plus', 'soulseek', 'vpn'
            'port-forwarding', 'protonvpn', 'pia', 'nat-pmp', 'port-sync', 'system-tray'
            'media-manager', 'plex', 'tmdb', 'auto-recovery'
          )
          if ($tags.Count -gt 16) { throw "winget allows at most 16 tags, got $($tags.Count)." }

          $localeFile = Get-ChildItem -Path .\winget-out -Recurse -Filter '*.locale.en-US.yaml' |
                        Select-Object -First 1
          if (-not $localeFile) { throw 'No en-US locale manifest was produced by wingetcreate.' }

          $replacements = @{
            'ShortDescription' = @("ShortDescription: $shortDescription")
            'Description'      = @('Description: |-') + ($description | ForEach-Object { "  $_" })
            'Tags'             = @('Tags:') + ($tags | ForEach-Object { "- $_" })
          }

          # Walk the file, swapping each target key's whole block (its own line plus any
          # continuation lines) for the replacement. Everything else - including the schema
          # comment and key order - is preserved, so the PR diff shows only these fields.
          $result   = [System.Collections.Generic.List[string]]::new()
          $replaced = [System.Collections.Generic.HashSet[string]]::new()
          $skipping = $false
          foreach ($line in Get-Content -LiteralPath $localeFile.FullName) {
            if ($line -match '^([A-Za-z][A-Za-z0-9]*):') {
              $key = $Matches[1]
              $skipping = $false
              if ($replacements.ContainsKey($key)) {
                $replacements[$key] | ForEach-Object { $result.Add($_) }
                [void]$replaced.Add($key)
                $skipping = $true
                continue
              }
            }
            if ($skipping) { continue }
            $result.Add($line)
          }

          $missing = $replacements.Keys | Where-Object { -not $replaced.Contains($_) }
          if ($missing) { throw "Locale manifest had no $($missing -join ', ') field to replace." }

          # UTF-8 without BOM, CRLF - matching what wingetcreate writes.
          Set-Content -LiteralPath $localeFile.FullName -Value $result -Encoding utf8
          Write-Host "Refreshed locale metadata in $($localeFile.Name)."

      # -----------------------------------------------------------------------
      # 7. Open the winget-pkgs PR (wingetcreate validates the manifests as it submits)
      # -----------------------------------------------------------------------
      - name: Submit manifest update to winget-pkgs
        if: steps.verify.outputs.ALREADY_PUBLISHED != 'True'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
          WINGET_TOKEN:    ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestDir = (Get-ChildItem -Path .\winget-out -Recurse -Filter '*.locale.en-US.yaml' |
                          Select-Object -First 1).Directory.FullName

          # No separate validation call: 'validate' is not a wingetcreate verb (its verbs are
          # new, update, new-locale, update-locale, submit, settings, token, cache, show, info,
          # dsc - validation belongs to the winget client, which is not on the runner). submit
          # validates the manifests itself and refuses to open a PR for an invalid one, so the
          # locale rewrite above is still gated before anything reaches winget-pkgs.
          .\wingetcreate.exe submit $manifestDir --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "winget-pkgs submission PR opened for $env:RELEASE_VERSION."
