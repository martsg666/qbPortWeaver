name: Build Check

# Runs on every branch push and pull request to catch compile errors before release.
#
# The push filter names branches rather than using 'tags-ignore': a push filter that lists only
# tags/tags-ignore scopes the trigger to tags, so ignoring every tag left the push block matching
# nothing and this workflow ran on pull requests alone (30 of 30 runs, confirmed against the run
# history). A branches filter never matches tags, so build-release.yml keeps exclusive ownership
# of tag pushes either way.
#
# Only master and the bare 2.x.y release branches are listed, because they are the only ones that
# take pushes outside a pull request (release merges, and CI fixes applied with admin bypass).
# feature/*, fix/*, qa/* and rc/* all work through a PR, and a push to a branch with an open PR
# already re-runs this workflow via the pull_request trigger - listing them here would only
# duplicate that run, since the concurrency group is keyed on github.ref and the two events carry
# different refs. A branch not listed here is still checked the moment its PR opens.
on:
  push:
    branches:
      - 'master'
      - '2.*'
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true  # cancel superseded builds on the same branch

permissions:
  contents: read  # least privilege - the build only reads the repo

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        # Pinned to a specific commit SHA rather than a floating tag (e.g. @v4) so that
        # a compromised or force-pushed tag cannot silently introduce malicious code into
        # the pipeline. Update the SHA intentionally when upgrading the action.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET
        # Pinned to a specific commit SHA - see checkout step for rationale.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.x'

      # Same four files build-release.yml checks against the tag, but there is no tag here, so
      # this checks they agree with each other. That is the failure mode worth catching early:
      # PLUGININFO is the odd one out (not a .csproj, and under plugins/), so it is the file most
      # likely to be missed when a cycle opens with a version bump. Without this the mismatch
      # surfaces only when the release tag is pushed - after the tag exists, which is the most
      # expensive moment to find it.
      - name: Verify project and plugin versions agree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # PLUGININFO is a key = "value" file, not XML, hence the second pattern.
          $targets = @(
            @{ Path = 'qbPortWeaver\qbPortWeaver.csproj';                Pattern = '<Version>([^<]+)</Version>' }
            @{ Path = 'HelperService\qbPortWeaver.HelperService.csproj'; Pattern = '<Version>([^<]+)</Version>' }
            @{ Path = 'qbPortWeaver.Shared\qbPortWeaver.Shared.csproj';  Pattern = '<Version>([^<]+)</Version>' }
            @{ Path = 'plugins\qbpw_nicotine_bridge\PLUGININFO';         Pattern = 'Version\s*=\s*"([^"]+)"' }
          )
          $found = @{}
          foreach ($target in $targets) {
            $match = Select-String -Path $target.Path -Pattern $target.Pattern
            if (-not $match) { throw "Version not found in $($target.Path)." }
            $found[$target.Path] = $match.Matches[0].Groups[1].Value
          }
          # @() forces an array: with one distinct value Sort-Object returns a scalar string, and
          # $distinct[0] would then index into the string and report its first character.
          $distinct = @($found.Values | Sort-Object -Unique)
          if ($distinct.Count -ne 1) {
            $detail = ($found.GetEnumerator() | Sort-Object Key | ForEach-Object { "  $($_.Key) = $($_.Value)" }) -join "`n"
            throw "Version mismatch across the release files:`n$detail`nBump all four together."
          }
          Write-Host "Version check passed: all four files are $($distinct[0])."

      # The Chocolatey Community Repository caps the package description at 4000 characters, and
      # choco pack only discovers the overrun during the post-tag release build - after the tag
      # exists, the same expensive moment the version gate above exists to avoid. The description
      # carries the feature list, so it grows every cycle and drifts toward the limit on its own.
      - name: Verify Chocolatey description length
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $limit  = 4000
          $nuspec = [xml](Get-Content 'choco\qbPortWeaver.nuspec' -Raw)
          # The XML adapter yields a string for a plain text element and an XmlElement when the
          # element carries anything else, so handle both rather than assuming one.
          $node        = $nuspec.package.metadata.description
          $description = if ($node -is [string]) { $node } else { $node.InnerText }
          if ([string]::IsNullOrWhiteSpace($description)) {
            throw 'No description found in choco\qbPortWeaver.nuspec.'
          }
          if ($description.Length -gt $limit) {
            throw "Chocolatey description is $($description.Length) characters, over the $limit limit. Shorten it before tagging - choco pack would otherwise fail the release build."
          }
          Write-Host "Chocolatey description length: $($description.Length) / $limit ($($limit - $description.Length) to spare)."

      - name: Build
        run: dotnet build qbPortWeaver.slnx --configuration Release /warnaserror
