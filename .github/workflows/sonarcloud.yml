name: SonarCloud

# Analyzes the codebase with SonarCloud through the real MSBuild build (SonarScanner for .NET),
# so the analyzer honours the project's MSBuild settings - notably <Nullable>enable</Nullable>,
# which SonarCloud Automatic Analysis cannot see (it does not run the build). This replaces
# Automatic Analysis: turn Automatic Analysis OFF in the SonarCloud project settings, otherwise
# this CI analysis is rejected with "you are running CI analysis while Automatic Analysis is enabled".
#
# Requires the SONAR_TOKEN secret (SonarCloud > My Account > Security > Generate Token).
# Verify the project key below matches your SonarCloud project (Project > Information, or the URL).

on:
  # master only. Branch analysis is a paid feature for this organisation, so a run on any other
  # branch produces a result nobody can read: the API answers "Organization is not allowed to
  # access data from non main branches", and the branch shows no analysis date in the UI. Those
  # runs also duplicated the pull_request run on the same commit. Pull request analysis IS
  # included, and posts a full quality gate, so every branch is still covered through its PR.
  #
  # That last point covers qa/ and rc/ too, and it is worth being exact because the wording here
  # previously said the opposite. Those branches take direct commits in the sense that no PR is
  # needed per change, but one is always opened for the batch (every rc/ branch back to 2.6.0 had
  # one), and a push to a branch with an open PR re-runs both this workflow and build.yml through
  # their pull_request triggers. The run history bears that out: every SonarCloud and Build Check
  # run on an rc/ branch carries event=pull_request, and there are dozens of them per cycle. What
  # an rc/ branch genuinely has is no coverage in the window before its PR is opened.
  #
  # build.yml's push filter is master plus 2.*, not a broad one: those are the only branches that
  # take pushes outside a pull request.
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true  # always analyze the latest commit on the ref

permissions:
  contents: read

jobs:
  sonarcloud:
    name: Analyze
    # Skip on fork PRs: repository secrets (SONAR_TOKEN) are not exposed to forked pull requests,
    # so the analysis cannot authenticate and would fail. This runs on pushes (master/release
    # branches) and on same-repo PRs; a fork PR skips the job cleanly instead of red-x'ing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # -----------------------------------------------------------------------
      # 1. Validate the SONAR_TOKEN secret before doing any work
      # -----------------------------------------------------------------------
      - name: Validate required secrets
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SONAR_TOKEN) {
            throw "SONAR_TOKEN secret is not configured. Add it in Settings → Secrets before running this workflow."
          }
          Write-Host "Required secrets validated."

      # -----------------------------------------------------------------------
      # 2. Checkout with full history so SonarCloud blame / new-code detection is accurate
      # -----------------------------------------------------------------------
      - name: Checkout repository
        # Pinned to a commit SHA rather than a floating tag so a compromised or force-pushed tag
        # cannot silently introduce malicious code into the pipeline (see build.yml).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        # Pinned to a commit SHA - see checkout step for rationale.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.x'

      # Installed in its own step so the global-tools path is on PATH for the analyze step.
      - name: Install SonarScanner for .NET
        shell: pwsh
        run: dotnet tool install --global dotnet-sonarscanner

      # -----------------------------------------------------------------------
      # 3. Run the analysis around the real build so MSBuild settings are honoured
      # -----------------------------------------------------------------------
      - name: Build and analyze
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The SonarScanner runs on Java; use the runner's pre-installed JDK 17.
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64

          # No test project exists, so exclude everything from coverage: this leaves "Coverage on
          # New Code" with no lines to evaluate (N/A) instead of 0%, so the default "Sonar way"
          # quality gate's coverage condition does not fail. Narrow this if a test suite is added.
          dotnet-sonarscanner begin `
            /k:"martsg666_qbPortWeaver" `
            /o:"martsg666" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.coverage.exclusions="**/*"

          # Deliberately no /warnaserror here: this build only feeds the scanner. A build that
          # fails on a warning would skip the "end" step below and upload no analysis at all -
          # losing the report exactly when it is most useful. Warning enforcement lives in
          # build.yml (every PR and non-tag push) and build-release.yml (every tag), so a
          # warning still cannot reach a release.
          dotnet build qbPortWeaver.slnx --configuration Release

          dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
