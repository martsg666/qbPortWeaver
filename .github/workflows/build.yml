name: Build Check

# Runs on every branch push and pull request to catch compile errors before release.
# Tag pushes are handled exclusively by build-release.yml.
on:
  push:
    tags-ignore:
      - '**'  # tag pushes are handled exclusively by build-release.yml
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true  # cancel superseded builds on the same branch

permissions:
  contents: read  # least privilege - the build only reads the repo

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        # Pinned to a specific commit SHA rather than a floating tag (e.g. @v4) so that
        # a compromised or force-pushed tag cannot silently introduce malicious code into
        # the pipeline. Update the SHA intentionally when upgrading the action.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET
        # Pinned to a specific commit SHA - see checkout step for rationale.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build qbPortWeaver.slnx --configuration Release /warnaserror
